flutter_launcher_icons:
  android: "launcher_icon"
  ios: true

  image_path: "assets/images/logo/app_icon/app_icon_logo.png"
  adaptive_icon_background: "assets/images/logo/app_icon/app_logo_background.png"
  adaptive_icon_foreground: "assets/images/logo/app_icon/app_logo_foreground_dark.png"

  min_sdk_android: 21

  web:
    generate: true
    image_path: "assets/images/logo/app_icon/app_icon_logo.png"

  windows:
    generate: true
    image_path: "assets/images/logo/app_icon/app_icon_logo.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/images/logo/app_icon/app_icon_logo.png"
