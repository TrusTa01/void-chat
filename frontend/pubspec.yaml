name: void_chat
description: "A messanger/chat"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ui
  flutter_colorpicker: ^1.1.0

  # localization
  flutter_localizations:
    sdk: flutter
  flutter_localized_locales: ^2.0.5

  # data
  json_annotation: ^4.11.0
  freezed_annotation: ^3.1.0

  # state management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # di
  get_it: ^9.2.1
  injectable: ^3.0.0

  # router
  auto_route: ^11.1.0

  # logging 
  talker_flutter: ^5.1.17
  talker_bloc_logger: ^5.1.17
  talker_dio_logger: ^5.1.17

  # locale caching
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # localization
  intl: ^0.20.2

  # generators
  build_runner: ^2.15.0
  json_serializable: ^6.13.2
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  auto_route_generator: ^10.5.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
